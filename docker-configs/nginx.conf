server {
    listen 80;
    server_name localhost;

    # Logs
    access_log /var/log/nginx/minecraft-prismarine-access.log;
    error_log  /var/log/nginx/minecraft-prismarine-error.log;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket support (necesario para el cliente Prismarine)
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Reemplazar COEP de Express: usar credentialless en lugar de require-corp
        # Esto permite cargar iframes (ej: editor Blockly) sin bloqueo de seguridad
        proxy_hide_header  Cross-Origin-Embedder-Policy;
        add_header         Cross-Origin-Embedder-Policy "credentialless" always;
        add_header         Cross-Origin-Opener-Policy   "same-origin" always;
    }

    location /blockly/ {
        alias /app/mc/prismarine-web-client/dist/blockly/;
        
        # Permitir embedding en iframes (compatible con COEP: credentialless del padre)
        add_header Cross-Origin-Resource-Policy  "cross-origin" always;
        add_header Cross-Origin-Embedder-Policy  "credentialless" always;
        add_header Cross-Origin-Opener-Policy    "unsafe-none" always;
        add_header X-Frame-Options               "SAMEORIGIN" always;
        add_header Access-Control-Allow-Origin   "*" always;
    }
}
