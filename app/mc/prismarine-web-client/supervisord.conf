[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx_stdout.log
stderr_logfile=/var/log/nginx_stderr.log

[program:prismarine-client]
command=node server.js
directory=/app/mc/prismarine-web-client
autostart=true
autorestart=true
stdout_logfile=/var/log/prismarine_stdout.log
stderr_logfile=/var/log/prismarine_stderr.log

[program:minecraft-server]
command=java -Xms2G -Xmx6144M -jar spigot-1.16.5.jar nogui
directory=/app/mc
autostart=true
autorestart=true
stdout_logfile=/var/log/minecraft_stdout.log
stderr_logfile=/var/log/minecraft_stderr.log
